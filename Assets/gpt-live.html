<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Better Flow Live Audio</title>
  <style>html,body{margin:0;padding:0;background:transparent;overflow:hidden}</style>
</head>
<body>
  <audio id="remote-audio" autoplay playsinline></audio>
  <script>
    (() => {
      let peer = null;
      let events = null;
      let stream = null;
      const audio = document.getElementById('remote-audio');
      const post = (message) => window.chrome.webview.postMessage(message);
      const waitForIce = (connection) => new Promise((resolve, reject) => {
        if (connection.iceGatheringState === 'complete') return resolve();
        const timer = setTimeout(() => reject(new Error('WebRTC候補の収集がタイムアウトしました。')), 15000);
        const changed = () => {
          if (connection.iceGatheringState === 'complete') {
            clearTimeout(timer);
            connection.removeEventListener('icegatheringstatechange', changed);
            resolve();
          }
        };
        connection.addEventListener('icegatheringstatechange', changed);
      });

      const begin = async (options) => {
        stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        const audioDevices = await navigator.mediaDevices.enumerateDevices();
        const inputs = audioDevices.filter((device) => device.kind === 'audioinput');
        let selected = null;
        if (options.microphoneLabel && options.microphoneLabel !== 'system-default') {
          const wanted = options.microphoneLabel.toLocaleLowerCase().replace(/[^\p{L}\p{N}]+/gu, '');
          selected = inputs.find((device) => {
            const label = device.label.toLocaleLowerCase().replace(/[^\p{L}\p{N}]+/gu, '');
            return label.includes(wanted) || wanted.includes(label);
          });
        }

        if (selected?.deviceId) {
          for (const track of stream.getTracks()) track.stop();
          const audioOptions = {
            deviceId: { exact: selected.deviceId },
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true
          };
          try {
            stream = await navigator.mediaDevices.getUserMedia({ audio: audioOptions, video: false });
          } catch {
            stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
            post({ type: 'microphone-fallback', message: '選択したマイクを利用できないため、システム設定の既定マイクを使います。' });
          }
        }

        peer = new RTCPeerConnection();
        peer.ontrack = (event) => {
          audio.srcObject = event.streams[0] || new MediaStream([event.track]);
          audio.play().catch(() => post({ type: 'status', message: '音声の再生を開始できませんでした。' }));
        };
        peer.onconnectionstatechange = () => post({ type: 'connection', state: peer.connectionState });
        for (const track of stream.getAudioTracks()) peer.addTrack(track, stream);

        events = peer.createDataChannel('oai-events');
        events.onopen = () => post({ type: 'data-channel-open' });
        events.onmessage = (event) => {
          try { post({ type: 'live-event', event: JSON.parse(event.data) }); }
          catch { post({ type: 'status', message: 'GPT Liveから読めないイベントを受け取りました。' }); }
        };
        events.onerror = () => post({ type: 'status', message: 'GPT Liveのイベント通信でエラーが発生しました。' });

        const offer = await peer.createOffer();
        await peer.setLocalDescription(offer);
        await waitForIce(peer);
        post({ type: 'offer', sdp: peer.localDescription.sdp });
      };

      const sendEvent = (event) => {
        if (!events || events.readyState !== 'open') throw new Error('GPT Liveの通信がまだ準備できていません。');
        events.send(JSON.stringify(event));
      };

      const stop = () => {
        try { if (events?.readyState === 'open') sendEvent({ type: 'session.close' }); } catch { }
        events?.close();
        peer?.close();
        for (const track of stream?.getTracks() || []) track.stop();
        stream = null;
        peer = null;
        events = null;
        audio.pause();
        audio.srcObject = null;
        post({ type: 'stopped' });
      };

      window.chrome.webview.addEventListener('message', async (event) => {
        const message = event.data;
        try {
          if (message.type === 'start') await begin(message);
          else if (message.type === 'answer') await peer.setRemoteDescription({ type: 'answer', sdp: message.sdp });
          else if (message.type === 'send-event') sendEvent(message.event);
          else if (message.type === 'stop') stop();
        } catch (error) {
          post({ type: 'error', message: error?.message || 'WebRTC接続を開始できませんでした。' });
        }
      });
      post({ type: 'ready' });
    })();
  </script>
</body>
</html>
